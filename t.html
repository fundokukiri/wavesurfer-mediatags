<div id="w" style="width:280px;height:50px"></div>
<script src="wavesurfer-7.min.js"></script>
<script>
const ws = WaveSurfer.create({ container: "#w", height: 50, barWidth: 2, minPxPerSec: 100, url: "/audio/Son Tung M-TP - Lạc Trôi.mp3" });
window.ws = ws;
window.log = [];
ws.on("click", (p) => window.log.push("click " + p));
ws.on("interaction", (p) => window.log.push("interaction " + p));
ws.on("ready", () => window.log.push("ready"));
ws.on("error", (e) => window.log.push("error " + e));
</script>
